<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>SPH Fluid Simulation</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/gh/RonenNess/Vector2js/dist/vector2js.js"></script>
</head>
<body>

<h1>SPH Fluid Simulation</h1>

<div id="topcontainer">
    <div id="mediacontrols">
        <button id="pause" name="pause">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2d/Play_Pause_icon_2283501.svg/1024px-Play_Pause_icon_2283501.svg.png"
                 alt="Pause or Play">
        </button>
        <button id="skip" name="skip">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/Fast_forward_font_awesome.svg/1024px-Fast_forward_font_awesome.svg.png"
                 alt="Skip to Next Frame">
        </button>
    </div>
    <div id="fps-display">FPS: 0</div>
</div>

<canvas id="canvas" onmousemove="updateuserparticle(event)" width="300" height="300">
    Your browser does not support the HTML5 canvas tag.
</canvas>

<div id="settings-container">
    <div class="slider">
        <label for="canvas_width">Canvas Width:</label>
        <input type="number" id="canvas_width" min="100" max="800" value="300">
    </div>
    <div class="slider">
        <label for="canvas_height">Canvas Height:</label>
        <input type="number" id="canvas_height" min="100" max="800" value="300">
    </div>
    <div class="slider">
        <label for="viscoscity">Viscosity:</label>
        <input type="range" id="viscoscity" min="0" max="10" value="6" step="1">
    </div>
    <div class="slider">
        <label for="restdensity">Rest Density:</label>
        <input type="range" id="restdensity" name="restdensity" min="0" max="10" value="1" step="1">
    </div>
    <div class="slider">
        <label for="pressuremultiplier">Pressure Multiplier:</label>
        <input type="range" id="pressuremultiplier" name="pressuremultiplier" min="0" max="18" value="2" step="1">
    </div>
    <div class="slider">
        <label for="gravity">Gravity:</label>
        <input type="range" id="gravity" name="gravity" min="0" max="100" value="50">
    </div>
    <div class="slider">
        <label for="ballradius">Ball Radius:</label>
        <input type="range" id="ballradius" name="ballradius" min="0" max="9" value="2" step="1">
    </div>
    <div class="input-container">
        <label for="particlecolours">Toggle speed colours</label>
        <input type="checkbox" id="particlecolours">
    </div>
    <div class="input-container">
        <label for="numparticles">Number of Particles:</label>
        <input type="number" id="numparticles" min="0" max="2000" value="2000">
    </div>
    <button id="Restart">Restart Simulation</button>
</div>

<script src="particle.js"></script>
<script src="quadtree.js"></script>
<script src="SPHFluidsimulator.js"></script>
<script src="sketch.js"></script>

</body>
</html>
